<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <script>
    try {
      var savedScheme = localStorage.getItem('color-scheme');
      if (savedScheme === 'dark' || savedScheme === 'light') {
        document.querySelector('meta[name="color-scheme"]').content = savedScheme;
        document.documentElement.dataset.theme = savedScheme;
      } else {
        document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    } catch (_) {}
  </script>
  <title>RelayStudio · 智能体接力与多栏工作台</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
